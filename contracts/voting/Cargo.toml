[package]
name = "voting"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
zkvote-groth16 = { path = "../zkvote-groth16" }
vdf = { path = "../vdf" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
zkvote-groth16 = { path = "../zkvote-groth16", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "zkvote-groth16/testutils"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
